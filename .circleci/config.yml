version: 2.1

jobs:
  canary_t-01:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Index byte offsets
          command: |
            mkdir -p /tmp/ci-ws
            set +o pipefail 2>/dev/null; seq 1 926281 | md5sum > /tmp/ci-ws/step-30.out; true
            size=$(wc -c </tmp/ci-ws/step-30.out); echo "stage ok: t-01 size=${size}"
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - step-30.out
  t-01:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ci-ws
      - run:
          name: Inspect pre-stage
          command: |
            { head -n 5 /tmp/ci-ws/step-30.out > /dev/null; echo "lines ok" ; } || true
      - run:
          name: Grab repository
          command: git clone --depth 2 -q --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch fixtures
          command: tar -I gzip -xf build-dist.tgz
      - run:
          name: Package artifacts
          command: g++ --version
      - run:
          no_output_timeout: 99m
          command: taskset -c 0-3 ./wrapper
